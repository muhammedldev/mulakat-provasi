    <!-- Open Graph / sosyal medya paylaşım önizlemesi (WhatsApp, LinkedIn, Telegram vb. -
         özellikle "Arkadaşını Meydan Oku" linki paylaşılırken kullanılıyor). Vercel'e
         deploy edilen sabit adres (mulakat-provasi.vercel.app) üzerinden mutlak URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mika · Mülakat Provası" />
    <meta property="og:title" content="Mika · Mülakat Provası" />

    <meta property="og:image" content="https://mulakat-provasi.vercel.app/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mika · Mülakat Provası" />

  <body>
    <div id="root"></div>
    <script>
      // Eski Android WebView'lerde (ör. Android 7.0/API 24'ün Chrome 69
      // WebView'i) queueMicrotask global fonksiyonu hiç yok (Chrome 71'de
      // eklendi) — React bunu kullanıyor, eksik olunca uygulama hiç
      // başlamadan "queueMicrotask is not defined" hatasıyla beyaz ekranda
      // kalıyordu (bir API 24 emülatöründe canlı test edilip bulundu).
      // Modül script'lerinden ÖNCE, en erken noktada çalışması gerekiyor.
      if (typeof queueMicrotask !== 'function') {
        window.queueMicrotask = function (callback) {
          Promise.resolve().then(callback).catch(function (e) {
            setTimeout(function () {
              throw e;
            });
          });
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
